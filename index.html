    <meta name="theme-color" content="#ffffff" />
    <!-- Theme before first paint (no light flash in dark mode). Same rule as src/state/theme.js. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var pref = localStorage.getItem('aurafin:theme');
          if (pref === 'dark' || pref === 'light') theme = pref;
          else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#13213a');
        try {
          if (localStorage.getItem('aurafin:privacy') === '1') document.documentElement.setAttribute('data-privacy', '');
        } catch (e) {}
      })();
    </script>
